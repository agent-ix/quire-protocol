[package]
name = "quire-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
description = "Strict consumer boundary for accepted native Quire protocol packages"
publish = false

[dependencies]
quire-spec-language = { git = "https://github.com/agent-ix/quire-spec-language", rev = "2736b62b2f741496590d099d71478b3044d638d6" }
quire-observation = { git = "https://github.com/agent-ix/quire-observation", rev = "2bdeb833a330bfa777c19eb4c28c423f856f3ba6" }
quire-verification-contracts = { git = "https://github.com/agent-ix/quire-verification-contracts", rev = "da8d7272051b1cf02768ec459539551414fd6c21" }
# Owner of the claim-strength vocabulary (EA FR-022). Only the serde-only
# `claim-strength` feature: no serde_json, no arbitrary_precision.
engineering-assurance = { version = "=0.3.1", git = "https://github.com/agent-ix/engineering-assurance", rev = "712f4ff76c2b1e01d26d10efd97a0eef0235defa", default-features = false, features = ["claim-strength"] }
# Reading the offer's already-published members and serialising B's own
# selections through A's `Serialize` impls. B adds no schema, grammar or wire
# decoder of its own: every record shape used here is A's.
serde_json = "=1.0.151"
serde = { version = "=1.0.228", features = ["derive"] }
jsonschema = { version = "=0.17.1", default-features = false, features = ["draft202012"] }
# Streams bounded producer-value request identities without allocating a
# caller-sized preimage. This is a digest carrier, not a semantic owner.
sha2 = "=0.10.9"

[dev-dependencies]
agent-ix-baseline-producer = { version = "=0.0.0", git = "https://github.com/agent-ix/filament-core-data", rev = "a6fe662542770e6acbec4917cfe1772b349ee414" }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
quire-contract-ir = { package = "quire-contract-model", git = "https://github.com/agent-ix/quire-contract-ir", rev = "53cc03c639e2e26528132d34d96dc56449df78e8" }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
