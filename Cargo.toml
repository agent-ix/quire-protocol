[package]
name = "quire-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
description = "Strict consumer boundary for accepted native Quire protocol packages"
publish = false

[dependencies]
# QSL main, followed by branch; Cargo.lock holds the commit. `checked-handoff`
# is the feature that publishes `Selection` (QSL FR-517), which the admission
# compares an admitted package with.
quire-spec-language = { git = "https://github.com/agent-ix/quire-spec-language", branch = "qsl-1961-s1-pa24-record", features = ["checked-handoff"] }
qsl-foundation = { git = "https://github.com/agent-ix/quire-spec-language", branch = "qsl-1961-s1-pa24-record" }
# The bytes-only identity and equality files (QSL FR-531, FR-533).
qsl-package = { git = "https://github.com/agent-ix/quire-spec-language", branch = "qsl-1961-s1-pa24-record" }
# The checked-package evaluation entries (QSL FR-390, FR-520, FR-531, FR-533).
qsl-eval = { git = "https://github.com/agent-ix/quire-spec-language", branch = "qsl-1961-s1-pa24-record" }
# The channel overflow, loss selector and outstanding vocabulary (QSL FR-308,
# FR-218) the declarations retain, and the wire graph that keys protocol nodes in tests.
qsl-semantics = { git = "https://github.com/agent-ix/quire-spec-language", branch = "qsl-1961-s1-pa24-record" }
# The capability-backend registry and candidate sets (QSL FR-075, FR-290), the
# truth and settlement-basis vocabulary and the separating-witness record.
qsl-route = { git = "https://github.com/agent-ix/quire-spec-language", branch = "qsl-1961-s1-pa24-record" }
# The protocol analysis engine and its `analyze` item adapters (QSL ADR-036).
qsl-analyze = { git = "https://github.com/agent-ix/quire-spec-language", branch = "qsl-1961-s1-pa24-record" }
qsl-replay = { git = "https://github.com/agent-ix/quire-spec-language", branch = "qsl-1961-s1-pa24-record" }
quire-eval = { git = "https://github.com/agent-ix/quire-eval", branch = "main" }
quire-exact = { git = "https://github.com/agent-ix/quire-exact", branch = "main" }
quire-semantic-value = { git = "https://github.com/agent-ix/quire-semantic-value", branch = "main" }
# Contract IR's checked-package reader (FR-043); the one reader of the format.
quire-contract-model = { git = "https://github.com/agent-ix/quire-contract-ir", branch = "main" }
quire-observation = { git = "https://github.com/agent-ix/quire-observation", branch = "main" }
quire-verification-contracts = { git = "https://github.com/agent-ix/quire-verification-contracts", branch = "main" }
# Owner of the claim-strength vocabulary (EA FR-022). Only the serde-only
# `claim-strength` feature: no serde_json, no arbitrary_precision.
engineering-assurance = { version = "=0.7.1", git = "https://github.com/agent-ix/engineering-assurance", branch = "main", default-features = false, features = ["claim-strength"] }
serde = { version = "=1.0.228", features = ["derive"] }
jsonschema = { version = "=0.17.1", default-features = false, features = ["draft202012"] }
sha2 = "=0.10.9"

[dev-dependencies]
# The owner's static-bundle test fixture (tc_003_compensation).
quire-observation = { git = "https://github.com/agent-ix/quire-observation", branch = "main", features = ["test-support"] }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
# QSL's public front end, which a realizability subject is built from in tests
# (a `CheckedPackage` is QSL's in-process form; the handoff does not carry it).
qsl-cst = { git = "https://github.com/agent-ix/quire-spec-language", branch = "qsl-1961-s1-pa24-record" }
qsl-forms = { git = "https://github.com/agent-ix/quire-spec-language", branch = "qsl-1961-s1-pa24-record" }
quire-checked = { git = "https://github.com/agent-ix/quire-eval", branch = "main" }
serde_json = "=1.0.151"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
