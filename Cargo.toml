[package]
name = "quire-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "Strict consumer boundary for accepted native Quire protocol packages"

[dependencies]
quire-spec-language = { git = "https://github.com/agent-ix/quire-spec-language", rev = "72507f856457ba0922719bd5d9f5cadcce4058cd" }
# Reading the offer's already-published members and serialising B's own
# selections through A's `Serialize` impls. B adds no schema, grammar or wire
# decoder of its own: every record shape used here is A's.
serde_json = "=1.0.151"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
quire-contract-ir = { git = "https://github.com/agent-ix/quire-contract-ir", rev = "690bde7f2dc58662cf9ff0595c2c0e3b17107c6f" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
