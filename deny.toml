[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
    # `borrow-or-share`, reached through the QSL and IR dependencies.
    "MIT-0",
    # `ar_archive_writer`, a build dependency of `stacker` (QSL and IR dependencies).
    "Apache-2.0 WITH LLVM-exception",
    # The agent-ix crates this driver depends on (QSL, CG, IR, RT and their
    # first-party closure). This crate is AGPL-3.0-or-later too.
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/agent-ix/quire-exact",
    "https://github.com/agent-ix/quire-semantic-value",
]

[sources.allow-org]
github = ["agent-ix"]
